name: Build and deploy Jekyll site

# Replaces GitHub Pages' legacy builder, which ignores the Gemfile and pins
# jekyll 3.10 via the github-pages gem. Building here uses the Gemfile's own
# jekyll 4.3.3, so `bundle exec jekyll build` locally and the published site
# run the same toolchain.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Match the Ruby used locally (Homebrew ruby 3.4.5). Gemfile.lock is
          # resolved against 3.4, so an older Ruby here cannot install it.
          ruby-version: '3.4'
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
